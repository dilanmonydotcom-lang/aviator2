<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DroidVault — Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var base = parts.length > 0 ? '/' + parts[0] + '/' : '/';
        window.location.replace(base + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
